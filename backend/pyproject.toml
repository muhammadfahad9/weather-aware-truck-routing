[project]
name = "weather-truck-routing"
version = "1.0.0"
description = "Weather-aware truck routing API (Django)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["planner/tests"]
addopts = "-q --strict-markers -m \"not live\""
markers = [
    "live: hits real third-party APIs (deselected by default, run with -m live)",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["planner", "config"]
omit = ["*/tests/*", "config/wsgi.py", "config/asgi.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "DJ", "N"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"planner/tests/*" = ["PT011", "PT018", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["planner/domain", "planner/services"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
