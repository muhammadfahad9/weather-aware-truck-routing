name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t weather-truck-routing .
      - name: Smoke test the image (offline providers)
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci -e NUM_PROXIES=0 \
            -e ROUTING_PROVIDER=simulated -e ROUTING_FALLBACK= \
            -e WEATHER_PROVIDER=simulated -e GEOCODER=gazetteer weather-truck-routing
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q '<div id="root">'
          curl -fs -X POST localhost:8000/api/plan -H 'Content-Type: application/json' \
            -d "{\"origin\":{\"lat\":32.78,\"lon\":-96.8},\"destination\":{\"lat\":41.88,\"lon\":-87.63},\"departure_time\":\"$(date -u -d '+10 min' +%Y-%m-%dT%H:%M:%SZ)\",\"load_weight_lb\":38000,\"interval_miles\":25}" \
            | grep -q '"recommendation"'
